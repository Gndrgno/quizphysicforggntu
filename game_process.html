<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>Игра в викторину | Quiz Time</title>
  <link rel="stylesheet" href="css/game_process.css" />
</head>
<body>

  <!-- configure.js должен подключаться до game_process.js -->
  <script type="module" src="js/configure.js"></script>

  <main class="layout-root">
    <div class="cards-stack">

      <!-- Admin card -->
      <section id="adminGameControls" class="card admin-card" style="display:none;">
        <div class="card-top">
          <div class="status-block"><span class="pulse"></span><span id="statusTextAdmin">Статус: загрузка...</span></div>
          <div id="questionCounterAdmin" class="counter">Вопрос 0 / 0</div>
        </div>

        <h1 id="quizTitleAdmin" class="quiz-title">Загрузка...</h1>

        <div class="question-bleed">
          <p id="questionTextAdmin" class="question-text">...</p>

          <div class="timers">
            <div class="main-timer">
              <div class="progress-outer">
                <div id="progressBarAdmin" class="progress" style="width:100%"></div>
                <div class="timer-badge" id="timerAdmin">10</div>
              </div>
            </div>
            <div class="wait-timer" id="waitingBlockAdmin" aria-hidden="true" style="display:none">
              <div class="progress-outer waiting-outer">
                <div id="waitingProgressBarAdmin" class="progress waiting" style="width:100%"></div>
                <div class="timer-badge waiting-badge" id="waitingTimerAdmin">5</div>
              </div>
              <div class="next-hint" id="nextHintAdmin">Следующий вопрос через <span id="waitingTextAdmin">5</span> с</div>
            </div>
          </div>

          <div class="answers-and-players">
            <div class="players-column">
              <div class="section-title">Ответы игроков (текущий вопрос)</div>
              <div id="playersAnswersList" class="players-list"></div>
            </div>

            <div class="ranking-column">
              <div class="section-title">Текущий рейтинг</div>
              <div id="liveRanking" class="players-list"></div>
            </div>
          </div>
        </div>

        <div class="card-actions">
          <button id="forceRevealBtn" class="btn secondary">Показать ответы</button>
          <button id="endGameBtn" class="btn danger">Завершить игру</button>
        </div>
      </section>

      <!-- Player card -->
      <section id="playerGameControls" class="card player-card" style="display:none;">
        <div class="card-top">
          <div class="title-left">
            <div id="quizTitlePlayer" class="quiz-title small">Загрузка...</div>
            <div id="questionCounterPlayer" class="counter small">Вопрос 0 / 0</div>
          </div>
          <div class="score-mini">
            <div id="yourTotalScore">Общий счёт: 0</div>
            <div id="yourTotalTime">Общее время: 0 с</div>
          </div>
        </div>

        <div class="question-bleed">
          <p id="questionTextPlayer" class="question-text">...</p>

          <div class="timers">
            <div class="main-timer">
              <div class="progress-outer">
                <div id="progressBarPlayer" class="progress" style="width:100%"></div>
                <div class="timer-badge" id="timerPlayer">10</div>
              </div>
            </div>
            <div class="wait-timer" id="waitingBlockPlayer" aria-hidden="true" style="display:none">
              <div class="progress-outer waiting-outer">
                <div id="waitingProgressBarPlayer" class="progress waiting" style="width:100%"></div>
                <div class="timer-badge waiting-badge" id="waitingTimerPlayer">5</div>
              </div>
              <div class="next-hint" id="nextHintPlayer">Следующий вопрос через <span id="waitingTextPlayer">5</span> с</div>
            </div>
          </div>

          <div id="answersList" class="answers-grid" role="list"></div>

          <div id="playerScoreBlock" class="score-pill" style="display:none;">
            <div class="score-val" id="playerScore">0</div>
            <div class="score-label">Баллов за вопрос</div>
          </div>
        </div>
      </section>

      <!-- Final results -->
      <section id="finalResults" class="card final-card" style="display:none;">
        <h2 class="quiz-title">Игра завершена!</h2>
        <div class="section-title">Итоговые баллы и время</div>
        <div id="finalScoresList" class="players-list final-list"></div>
        <div style="margin-top:18px;text-align:right">
          <button id="backToHomeBtn" class="btn primary">Вернуться на главную</button>
        </div>
      </section>

    </div>
  </main>
  <script type="module" src="js/configure.js"></script>
  <script type="module" src="js/game_process.js"></script>
</body>
</html>
